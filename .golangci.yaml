version: "2"
linters:
  enable:
    - copyloopvar
    - dupl
    - durationcheck
    - errcheck
    - errorlint
    - forcetypeassert
    - ineffassign
    - godot
    - gosec
    - govet
    - makezero
    - misspell
    - nilerr
    - predeclared
    - revive
    - sloglint
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    dupl:
      threshold: 200
    revive:
      rules:
        - name: dot-imports
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters: [dupl]
        path: pkg/cmd/fcs/kubernetes/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
